name: Bug Report
description: Report a bug in LumenAI SDK
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below.

  - type: input
    id: version
    attributes:
      label: LumenAI version
      description: "Output of `python -c 'import lumen_ai; print(lumen_ai.__version__)'`"
      placeholder: "0.1.3"
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - lumen-ai-core
        - lumen-ai-celery
        - lumen-ai-openlit
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal code to reproduce the issue.
      render: python
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        - Python version:
        - OS:
        - OTel SDK version:
        - Redis version (if applicable):
      render: text
    validations:
      required: false
