name: Release Drafter

on:
  push:
    branches: [LumenAI]

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@67e173cadb2fbd3de94f4a861e0c48c913b462ae
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
