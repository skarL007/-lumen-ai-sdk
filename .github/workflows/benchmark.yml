name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

jobs:
  processor-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/lumen-ai-core
          pip install pytest

      - name: Run processor benchmarks
        env:
          LUMEN_RUN_BENCHMARKS: "1"
        run: pytest tests/test_benchmark.py -v -s
