name: CI

on:
  push:
    branches: [LumenAI, main]
  pull_request:
    branches: [LumenAI, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core package
        run: pip install -e packages/lumen-ai-core

      - name: Verify import
        run: python -c "from lumen_ai import LumenAI, BaseInstrumentor; print('Import OK')"

      - name: Run tests
        run: |
          pip install pytest
          pytest tests/ -v

      - name: Install all packages
        run: |
          pip install -e packages/lumen-ai-celery
          pip install -e packages/lumen-ai-openlit

      - name: Build wheel artifacts
        run: |
          pip install build
          python -m build packages/lumen-ai-core --wheel --outdir /tmp/dist
          ls /tmp/dist
