name: CI

on:
  push:
    branches: [LumenAI, main]
  pull_request:
    branches: [LumenAI, main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/lumen-ai-core
          pip install ruff mypy

      - name: Ruff check
        run: ruff check packages/lumen-ai-core/src packages/lumen-ai-celery/src packages/lumen-ai-openlit/src --select E,F,W,I --ignore E501

      - name: Mypy type check
        run: mypy packages/lumen-ai-core/src/lumen_ai/ --ignore-missing-imports --no-error-summary

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/lumen-ai-core
          pip install -e packages/lumen-ai-celery
          pip install -e packages/lumen-ai-openlit
          pip install pytest pytest-cov fastapi httpx

      - name: Verify public imports
        run: python -c "from lumen_ai import LumenAI, BaseInstrumentor, RedisExporter, AsyncRedisExporter, JsonlExporter, lumen_tenant, reset_tenant_id; from lumen_ai_celery import CeleryInstrumentor; from lumen_ai_openlit import OpenLITBridge; print('Import OK')"

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=lumen_ai --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel and sdist artifacts
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          mkdir -p /tmp/lumen-dist
          python -m build packages/lumen-ai-core --outdir /tmp/lumen-dist
          python -m build packages/lumen-ai-celery --outdir /tmp/lumen-dist
          python -m build packages/lumen-ai-openlit --outdir /tmp/lumen-dist
          python -m twine check /tmp/lumen-dist/*
          ls -la /tmp/lumen-dist

      - name: Clean install wheels and verify imports
        run: |
          python -m venv /tmp/lumen-clean-wheel
          /tmp/lumen-clean-wheel/bin/python -m pip install --upgrade pip
          /tmp/lumen-clean-wheel/bin/python -m pip install /tmp/lumen-dist/*.whl
          /tmp/lumen-clean-wheel/bin/python -m pip check
          /tmp/lumen-clean-wheel/bin/python -c "import lumen_ai; import lumen_ai.models; from lumen_ai import LumenAI, JsonlExporter, lumen_tenant, reset_tenant_id; from lumen_ai_celery import CeleryInstrumentor; from lumen_ai_openlit import OpenLITBridge; print('Clean wheel install OK')"

      - name: Clean install sdists and verify imports
        run: |
          python -m venv /tmp/lumen-clean-sdist
          /tmp/lumen-clean-sdist/bin/python -m pip install --upgrade pip
          /tmp/lumen-clean-sdist/bin/python -m pip install /tmp/lumen-dist/*.tar.gz
          /tmp/lumen-clean-sdist/bin/python -m pip check
          /tmp/lumen-clean-sdist/bin/python -c "import lumen_ai; import lumen_ai.models; from lumen_ai import LumenAI, JsonlExporter, lumen_tenant, reset_tenant_id; from lumen_ai_celery import CeleryInstrumentor; from lumen_ai_openlit import OpenLITBridge; print('Clean sdist install OK')"

  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Audit installed release artifacts
        run: |
          python -m pip install --upgrade pip
          pip install build pip-audit
          mkdir -p /tmp/lumen-audit-dist
          python -m build packages/lumen-ai-core --wheel --outdir /tmp/lumen-audit-dist
          python -m build packages/lumen-ai-celery --wheel --outdir /tmp/lumen-audit-dist
          python -m build packages/lumen-ai-openlit --wheel --outdir /tmp/lumen-audit-dist
          pip install /tmp/lumen-audit-dist/*.whl
          pip-audit
