name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (core | celery | openlit | all)"
        required: true
        default: "all"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        package:
          - lumen-ai-core
          - lumen-ai-celery
          - lumen-ai-openlit

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build ${{ matrix.package }}
        if: >-
          ${{
            github.event_name == 'release' ||
            github.event.inputs.package == 'all' ||
            (github.event.inputs.package == 'core' && matrix.package == 'lumen-ai-core') ||
            (github.event.inputs.package == 'celery' && matrix.package == 'lumen-ai-celery') ||
            (github.event.inputs.package == 'openlit' && matrix.package == 'lumen-ai-openlit')
          }}
        run: python -m build packages/${{ matrix.package }}

      - name: Check ${{ matrix.package }} distributions
        if: >-
          ${{
            github.event_name == 'release' ||
            github.event.inputs.package == 'all' ||
            (github.event.inputs.package == 'core' && matrix.package == 'lumen-ai-core') ||
            (github.event.inputs.package == 'celery' && matrix.package == 'lumen-ai-celery') ||
            (github.event.inputs.package == 'openlit' && matrix.package == 'lumen-ai-openlit')
          }}
        run: twine check packages/${{ matrix.package }}/dist/*

      - name: Publish ${{ matrix.package }} to PyPI
        if: >-
          ${{
            github.event_name == 'release' ||
            github.event.inputs.package == 'all' ||
            (github.event.inputs.package == 'core' && matrix.package == 'lumen-ai-core') ||
            (github.event.inputs.package == 'celery' && matrix.package == 'lumen-ai-celery') ||
            (github.event.inputs.package == 'openlit' && matrix.package == 'lumen-ai-openlit')
          }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/${{ matrix.package }}/dist/
