[project]
name = "lumen-ai-openlit"
version = "0.1.0"
description = "LumenAI OpenLIT Bridge — zero-code LLM auto-instrumentation"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "skarL007", email = "zpka21@hotmail.com" }]
keywords = ["openlit", "observability", "opentelemetry", "llm", "auto-instrumentation", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "lumen-ai-core>=0.1.0",
    "openlit>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/skarL007/-lumen-ai-sdk"
Repository = "https://github.com/skarL007/-lumen-ai-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/lumen_ai_openlit"]
