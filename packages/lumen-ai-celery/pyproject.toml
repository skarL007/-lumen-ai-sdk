[project]
name = "lumen-ai-celery"
version = "0.1.4"
description = "LumenAI Celery Instrumentor - background task observability for AI workloads"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "skarL007", email = "zpka21@hotmail.com" }]
keywords = ["celery", "observability", "opentelemetry", "finops", "ai", "background-tasks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "lumen-ai-core>=0.1.3",
    "celery>=5.3.0",
    "opentelemetry-instrumentation-celery>=0.40b0",
]

[project.urls]
Homepage = "https://github.com/skarL007/-lumen-ai-sdk"
Repository = "https://github.com/skarL007/-lumen-ai-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/lumen_ai_celery"]
