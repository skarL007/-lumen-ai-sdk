[project]
name = "lumen-ai-core"
version = "0.1.4"
description = "LumenAI Core - Real-time FinOps & Observability layer for Generative AI"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "skarL007", email = "zpka21@hotmail.com" }]
keywords = ["observability", "opentelemetry", "finops", "llm", "ai", "multi-tenancy", "cost-tracking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-instrumentation>=0.40b0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/skarL007/-lumen-ai-sdk"
Repository = "https://github.com/skarL007/-lumen-ai-sdk"
"Bug Tracker" = "https://github.com/skarL007/-lumen-ai-sdk/issues"
Funding = "https://github.com/sponsors/skarL007"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumen_ai"]
