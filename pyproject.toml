[tool.uv.workspace]
members = [
    "packages/lumen-ai-core",
    "packages/lumen-ai-celery",
    "packages/lumen-ai-openlit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
